<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker & Grafik Interaktif</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-gray-100 font-sans min-h-screen py-8 px-4">
    <div class="max-w-4xl mx-auto">
      <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">
        Pencatat Keuangan & Grafik
      </h1>

      <!-- Kartu Ringkasan Saldo -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div
          class="bg-white p-6 rounded-xl shadow-md border-l-4 border-blue-500"
        >
          <p class="text-sm text-gray-500 font-semibold">Total Saldo</p>
          <h2 id="total-balance" class="text-2xl font-bold text-gray-800">
            Rp 0
          </h2>
        </div>
        <div
          class="bg-white p-6 rounded-xl shadow-md border-l-4 border-green-500"
        >
          <p class="text-sm text-gray-500 font-semibold">Total Pemasukan</p>
          <h2 id="total-income" class="text-2xl font-bold text-green-600">
            Rp 0
          </h2>
        </div>
        <div
          class="bg-white p-6 rounded-xl shadow-md border-l-4 border-red-500"
        >
          <p class="text-sm text-gray-500 font-semibold">Total Pengeluaran</p>
          <h2 id="total-expense" class="text-2xl font-bold text-red-600">
            Rp 0
          </h2>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div
          class="bg-white p-6 rounded-xl shadow-md flex flex-col justify-between"
        >
          <div>
            <h3 class="text-lg font-semibold text-gray-700 mb-4">
              Tambah Transaksi Baru
            </h3>
            <form id="transaction-form" class="space-y-4">
              <div>
                <label class="block text-sm text-gray-600 mb-1"
                  >Keterangan</label
                >
                <input
                  type="text"
                  id="description"
                  required
                  placeholder="Contoh: Gaji, Makan Siang..."
                  class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
              <div>
                <label class="block text-sm text-gray-600 mb-1"
                  >Jumlah (Rp)</label
                >
                <input
                  type="number"
                  id="amount"
                  required
                  placeholder="Contoh: 50000"
                  class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
              <div>
                <label class="block text-sm text-gray-600 mb-1"
                  >Tipe Transaksi</label
                >
                <select
                  id="type"
                  class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                  <option value="income">Pemasukan (+)</option>
                  <option value="expense">Pengeluaran (-)</option>
                </select>
              </div>
              <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition duration-200 cursor-pointer"
              >
                Tambah Transaksi
              </button>
            </form>
          </div>

          <div class="mt-6">
            <h3 class="text-lg font-semibold text-gray-700 mb-2">
              Riwayat Transaksi
            </h3>
            <ul
              id="transaction-list"
              class="space-y-2 max-h-48 overflow-y-auto pr-1"
            ></ul>
          </div>
        </div>

        <div
          class="bg-white p-6 rounded-xl shadow-md flex flex-col items-center justify-center"
        >
          <h3 class="text-lg font-semibold text-gray-700 mb-4">
            Grafik Keuangan
          </h3>
          <div class="w-full h-64 flex items-center justify-center">
            <canvas id="expenseChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
